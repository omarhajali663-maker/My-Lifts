<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>سجل الحديد</title>
<meta name="theme-color" content="#12161C">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="سجل الحديد">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="apple-touch-icon" href="icon-512.png">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Reem+Kufi:wght@500;600;700&family=Tajawal:wght@400;500;700;800&display=swap">
<style>
/* Layout concept: one phone-width column; weight-plate discs are the data marks; the loud moment is the plate-coloured scoreboard of the active workout. */
:root{
  --bg:#E9ECF0; --surface:#F8F9FB; --surface-2:#EDF0F4; --ink:#12161C; --ink-2:#48505C; --ink-3:#707A88; --line:#D3D8DF; --on-ink:#F8F9FB;
  --c-pull:36 87 214; --c-push:214 58 47; --c-legs:30 142 78; --c-upper:222 168 0; --c-other:107 118 133;
  --on-plate:#FFFFFF; --on-yellow:#14181F;
  --fail:232 89 12; --gold:176 118 0; --danger:#C62F2F; --scrim:rgb(10 13 18 / .52);
  --display:"Reem Kufi","Tajawal","Segoe UI",Tahoma,Arial,sans-serif;
  --body:"Tajawal","Segoe UI",Tahoma,Arial,sans-serif;
  --num:"Barlow Condensed","Tajawal","Segoe UI",Arial,sans-serif;
  --r:18px; --r-sm:12px; --nav-h:68px;
  direction:rtl;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1217; --surface:#171C23; --surface-2:#1F2530; --ink:#EEF1F5; --ink-2:#B1B9C5; --ink-3:#8791A0; --line:#2B323D; --on-ink:#0E1217;
    --c-pull:99 146 255; --c-push:255 112 98; --c-legs:84 208 140; --c-upper:255 201 51; --c-other:154 165 181;
    --on-plate:#0E1217; --on-yellow:#14181F;
    --fail:255 138 76; --gold:255 201 51; --danger:#FF7A6E; --scrim:rgb(0 0 0 / .62);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1217; --surface:#171C23; --surface-2:#1F2530; --ink:#EEF1F5; --ink-2:#B1B9C5; --ink-3:#8791A0; --line:#2B323D; --on-ink:#0E1217;
  --c-pull:99 146 255; --c-push:255 112 98; --c-legs:84 208 140; --c-upper:255 201 51; --c-other:154 165 181;
  --on-plate:#0E1217; --on-yellow:#14181F;
  --fail:255 138 76; --gold:255 201 51; --danger:#FF7A6E; --scrim:rgb(0 0 0 / .62);
  color-scheme:dark;
}
[data-type="pull"],.t-pull{--tc:var(--c-pull);--on-tc:var(--on-plate)}
[data-type="push"],.t-push{--tc:var(--c-push);--on-tc:var(--on-plate)}
[data-type="legs"],.t-legs{--tc:var(--c-legs);--on-tc:var(--on-plate)}
[data-type="upper"],.t-upper{--tc:var(--c-upper);--on-tc:var(--on-yellow)}
[data-type="other"],.t-other{--tc:var(--c-other);--on-tc:var(--on-plate)}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:auto}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;direction:rtl;
  padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid rgb(var(--tc,var(--c-pull)));outline-offset:2px;border-radius:8px}
#app{max-width:560px;margin-inline:auto;padding-block:18px calc(var(--nav-h) + 96px)}
.num{font-family:var(--num);font-variant-numeric:tabular-nums;font-weight:600;letter-spacing:.01em}
.en{font-family:var(--num);letter-spacing:.12em;text-transform:uppercase;font-weight:600;font-size:12px;color:var(--ink-3)}
.muted{color:var(--ink-3)} .sub{color:var(--ink-2)}
.h1{font-family:var(--display);font-weight:700;font-size:28px;line-height:1.2;margin:0;text-wrap:balance}
.h2{font-family:var(--display);font-weight:600;font-size:19px;line-height:1.3;margin:0}
.small{font-size:13px}
.row{display:flex;align-items:center;gap:12px;min-width:0}
.grow{flex:1;min-width:0}
.stack{display:flex;flex-direction:column;gap:16px}
.gap8{display:flex;flex-direction:column;gap:8px}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.plate{width:30px;height:30px;flex:none;color:rgb(var(--tc,var(--c-other)))}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:10px}
.brand .plate{width:34px;height:34px;color:var(--ink)}
.brand b{font-family:var(--display);font-size:22px;font-weight:700}
.datebox{text-align:end;font-size:13px;color:var(--ink-2);line-height:1.3}

/* cards and buttons */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card.tap{width:100%;text-align:start;display:block}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:14px;background:var(--ink);color:var(--on-ink);font-weight:700;font-size:16px;transition:transform .12s,opacity .12s}
.btn:active{transform:scale(.97)}
.btn.tc{background:rgb(var(--tc));color:var(--on-tc)}
.btn.ghost{background:var(--surface-2);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--danger)}
.btn.block{width:100%}
.btn.sm{min-height:38px;padding:0 14px;font-size:14px;border-radius:11px}
.icon-btn{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:var(--ink-2)}
.icon-btn:active{background:var(--surface-2)}
.chip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:99px;font-size:13px;font-weight:700;background:rgb(var(--tc,var(--c-other)) / .16);color:var(--ink)}
.chip::before{content:"";width:8px;height:8px;border-radius:50%;background:rgb(var(--tc,var(--c-other)))}
.pill{display:inline-flex;align-items:center;gap:5px;min-height:24px;padding:2px 9px;line-height:1.35;border-radius:99px;font-size:12px;font-weight:700;background:var(--surface-2);color:var(--ink-2)}
.pill.pr{background:rgb(var(--gold) / .18);color:rgb(var(--gold))}
.pill.pr svg{width:14px;height:14px}

/* segmented control */
.seg{display:flex;gap:4px;padding:4px;background:var(--surface-2);border:1px solid var(--line);border-radius:14px}
.seg button{flex:1;min-height:38px;border-radius:10px;font-weight:700;font-size:14px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgb(0 0 0 / .14)}

/* stats */
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stats.three{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (min-width:480px){.stats{grid-template-columns:repeat(4,minmax(0,1fr))}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat .v{font-family:var(--num);font-weight:700;font-size:28px;line-height:1.05;font-variant-numeric:tabular-nums}
.stat .v small{font-size:14px;font-weight:600;color:var(--ink-3);margin-inline-start:3px}
.stat .l{font-size:12px;color:var(--ink-3);margin-top:2px}

/* week strip */
.weekstrip{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.weekstrip .d{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--ink-3)}
.weekstrip .d.today{color:var(--ink);font-weight:700}
.weekstrip .d.today::after{content:"";width:16px;height:3px;border-radius:2px;background:var(--ink)}
.weekstrip .ring{width:30px;height:30px;color:var(--line)}

/* type list on home */
.typelist{display:flex;flex-direction:column;gap:10px}
.typerow{display:flex;align-items:center;gap:14px;width:100%;text-align:start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;min-height:64px}
.typerow:active{background:var(--surface-2)}
.typerow .plate{width:38px;height:38px}
.typerow b{font-family:var(--display);font-size:20px;font-weight:700;display:block;line-height:1.2}

/* active workout */
.scoreboard{background:rgb(var(--tc));color:var(--on-tc);border-radius:22px;padding:14px 14px 16px;margin-bottom:16px}
.scoreboard .bar{display:flex;align-items:center;gap:6px}
.scoreboard .icon-btn{color:var(--on-tc)}
.scoreboard .icon-btn:active{background:rgb(0 0 0 / .12)}
.scoreboard .t{font-family:var(--display);font-size:24px;font-weight:700;line-height:1.1}
.scoreboard .t small{display:block;font-family:var(--body);font-size:12px;font-weight:500;opacity:.85}
.scoreboard .big{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px;text-align:center}
.scoreboard .big .v{font-family:var(--num);font-weight:700;font-size:38px;line-height:1;font-variant-numeric:tabular-nums}
.scoreboard .big .l{font-size:12px;opacity:.85;margin-top:2px}
.scoreboard .fin{background:var(--on-tc);color:rgb(var(--tc));min-height:42px;padding:0 16px;border-radius:12px;font-weight:800}
.ex{padding:14px}
.ex-head{display:flex;align-items:flex-start;gap:8px;margin-bottom:6px}
.ex-head .nm{font-family:var(--display);font-size:19px;font-weight:700;line-height:1.3}
.hint{font-size:12.5px;color:var(--ink-3);margin:2px 0 10px}
.hint .num{font-size:15px;color:var(--ink-2)}
.sets{display:flex;flex-direction:column;gap:8px}
.setrow{display:grid;grid-template-columns:26px minmax(0,1fr) minmax(0,1fr) 44px 44px;gap:8px;align-items:center}
.setrow .n{font-family:var(--num);font-weight:700;font-size:18px;color:var(--ink-3);text-align:center}
.setrow .in{height:48px;width:100%;min-width:0;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);text-align:center;font-family:var(--num);font-weight:700;font-size:22px;direction:ltr;padding:0 4px}
.setrow .in::placeholder{color:var(--ink-3);opacity:.55}
.setrow .in:focus{outline:2px solid rgb(var(--tc));border-color:transparent}
.setrow .lbl{display:none}
.setrow.done .in{background:rgb(var(--tc) / .12);border-color:rgb(var(--tc) / .4)}
.setrow .sq{height:44px;width:44px;border-radius:12px;display:grid;place-items:center;border:1px solid var(--line);background:var(--surface-2);color:var(--ink-3)}
.setrow .sq.f[aria-pressed="true"]{background:rgb(var(--fail));border-color:rgb(var(--fail));color:var(--on-yellow)}
.setrow .sq.ok[aria-pressed="true"]{background:rgb(var(--tc));border-color:rgb(var(--tc));color:var(--on-tc)}
.colhead{display:grid;grid-template-columns:26px minmax(0,1fr) minmax(0,1fr) 44px 44px;gap:8px;font-size:11.5px;color:var(--ink-3);text-align:center;margin-bottom:4px}
.addset{margin-top:10px;width:100%;min-height:42px;border-radius:12px;border:1px dashed var(--line);color:var(--ink-2);font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px}
.addset:active{background:var(--surface-2)}
.menu-x{color:var(--ink-3)}

/* rest timer */
.rest{position:fixed;inset-inline:0;bottom:calc(var(--nav-h) + 10px + env(safe-area-inset-bottom,0px));z-index:20;display:flex;justify-content:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
.rest .in{pointer-events:auto;display:flex;align-items:center;gap:6px;background:var(--ink);color:var(--on-ink);border-radius:18px;padding:6px 8px 6px 14px;box-shadow:0 8px 24px rgb(0 0 0 / .28)}
.rest .tm{font-family:var(--num);font-weight:700;font-size:30px;min-width:64px;text-align:center;font-variant-numeric:tabular-nums}
.rest .l{font-size:12px;opacity:.75}
.rest button{height:38px;min-width:42px;padding:0 10px;border-radius:12px;font-weight:700;font-size:14px;background:rgb(255 255 255 / .14);color:inherit}
.rest.over .tm{color:rgb(var(--c-upper))}

/* bottom nav */
.nav{position:fixed;inset-inline:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
.nav .in{max-width:560px;margin-inline:auto;display:grid;grid-template-columns:repeat(4,1fr)}
.nav button{height:var(--nav-h);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:700;color:var(--ink-3)}
.nav button[aria-current="page"]{color:var(--ink)}
.nav button[aria-current="page"] svg{stroke-width:2.4}
.nav button{position:relative}
.nav button[aria-current="page"]::after{content:"";position:absolute;top:0;inset-inline-start:calc(50% - 14px);width:28px;height:3px;border-radius:0 0 3px 3px;background:var(--ink)}
.num{unicode-bidi:isolate}

/* history */
.navrow{display:flex;align-items:center;gap:8px}
.navrow .ttl{flex:1;text-align:center;font-family:var(--display);font-weight:700;font-size:18px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .h{font-size:12px;color:var(--ink-3);padding-bottom:4px}
.cal .c{aspect-ratio:1/1;display:grid;place-items:center;border-radius:10px;font-size:13px;color:var(--ink-2);position:relative;min-width:0}
.cal .c.out{opacity:.35}
.cal .c.today{box-shadow:inset 0 0 0 2px var(--ink)}
.cal .c.has{color:var(--on-tc);background:rgb(var(--tc));font-weight:800}
.cal .c.has.multi::after{content:"";position:absolute;inset-inline-end:4px;top:4px;width:6px;height:6px;border-radius:50%;background:var(--on-tc)}
.cal button.c{width:100%}
.sess{display:flex;align-items:center;gap:12px;width:100%;text-align:start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.sess:active{background:var(--surface-2)}
.sess .when{width:62px;text-align:center;flex:none}
.sess .when .d{font-family:var(--num);font-weight:700;font-size:26px;line-height:1}
.sess .when .m{font-size:11.5px;color:var(--ink-3)}
.sess .meta{font-size:13px;color:var(--ink-2)}
.chartbox{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 10px 8px}
svg.chart{width:100%;height:auto;display:block;overflow:visible}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .tick{fill:var(--ink-3);font-size:11px;font-family:var(--body)}
.chart .val{fill:var(--ink-2);font-size:11px;font-family:var(--num);font-weight:700}
.chart .bar{fill:rgb(var(--tc,var(--c-other)))}
.chart .stub{fill:var(--surface-2)}
.chart .ln{fill:none;stroke:var(--ink);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.chart .area{fill:rgb(var(--tc,var(--c-pull)) / .12);stroke:none}
.chart .dot{fill:var(--surface);stroke:var(--ink);stroke-width:2.5}
.chart .dot.pr{fill:rgb(var(--gold));stroke:rgb(var(--gold))}
.chart .sel{fill:var(--ink)}
.monthrow{display:flex;align-items:center;gap:10px;width:100%;text-align:start;padding:10px 4px;border-bottom:1px solid var(--line)}
.monthrow:last-child{border-bottom:0}
.monthrow .nm{width:96px;flex:none;font-weight:700}
.monthrow .track{flex:1;height:10px;border-radius:5px;background:var(--surface-2);overflow:hidden}
.monthrow .fill{height:100%;background:var(--ink);border-radius:5px}
.monthrow .ct{width:64px;flex:none;text-align:end;font-size:13px;color:var(--ink-2)}

/* forms and sheets */
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:700;color:var(--ink-2)}
.txt{height:48px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);padding:0 14px;width:100%}
select.txt{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink-3) 50%),linear-gradient(135deg,var(--ink-3) 50%,transparent 50%);background-position:calc(100% - 20px) 21px,calc(100% - 14px) 21px;background-size:6px 6px;background-repeat:no-repeat;padding-inline-end:36px}
html[dir="rtl"] select.txt,:root select.txt{background-position:14px 21px,20px 21px}
textarea.txt{height:auto;min-height:76px;padding:10px 14px;resize:vertical}
.scrim{position:fixed;inset:0;z-index:50;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:84%;overflow:auto;background:var(--surface);border-radius:22px 22px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
.libitem{display:flex;align-items:center;gap:10px;width:100%;text-align:start;padding:11px 6px;border-bottom:1px solid var(--line);min-height:50px}
.libitem:active{background:var(--surface-2)}
.libitem b{font-weight:700}
.toast{position:fixed;inset-inline:0;bottom:calc(var(--nav-h) + 74px + env(safe-area-inset-bottom,0px));z-index:60;display:flex;justify-content:center;pointer-events:none}
.toast span{background:var(--ink);color:var(--on-ink);padding:10px 16px;border-radius:12px;font-weight:700;font-size:14px;box-shadow:0 8px 24px rgb(0 0 0 / .25)}
.empty{text-align:center;padding:26px 12px;color:var(--ink-2)}
.empty .plate{width:56px;height:56px;color:var(--line);margin:0 auto 8px;display:block}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-3)}
.sync::before{content:"";width:8px;height:8px;border-radius:50%;background:rgb(var(--c-legs))}
.sync.local::before{background:rgb(var(--c-upper))}
.sync.wait::before{background:var(--ink-3)}
.sec{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:22px 2px 10px}
.sec:first-child{margin-top:0}
.sec a,.sec button.lnk{font-size:13px;font-weight:700;color:var(--ink-2)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (min-width:640px){#app{padding-top:28px}.h1{font-size:32px}}
.chart .tick.today{fill:var(--ink);font-weight:700}
.pill svg{width:14px;height:14px}
.btn svg{width:20px;height:20px}
.icon-btn:disabled{cursor:default}

</style>
<div id="app"></div>
<div id="rest" class="rest" aria-live="polite"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<nav id="nav" class="nav" aria-label="التنقل الرئيسي"></nav>
<div id="sheet"></div>
<script>
/* ===== logic: dates, numbers, stats (pure, no DOM) ===== */
const MONTHS = ['كانون الثاني','شباط','آذار','نيسان','أيار','حزيران','تموز','آب','أيلول','تشرين الأول','تشرين الثاني','كانون الأول'];
const WEEKDAYS = ['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const WD_SHORT = ['أحد','اثنين','ثلاثاء','أربعاء','خميس','جمعة','سبت'];
const WD_MIN = ['ح','ن','ث','ر','خ','ج','س'];
const TYPES = {
  pull:  { ar: 'سحب',  en: 'PULL' },
  push:  { ar: 'دفع',  en: 'PUSH' },
  legs:  { ar: 'أرجل', en: 'LEGS' },
  upper: { ar: 'علوي', en: 'UPPER' },
  other: { ar: 'حر',   en: 'FREE' }
};
const TYPE_ORDER = ['pull', 'push', 'legs', 'upper', 'other'];

/* ---- dates (all local time, dates as 'YYYY-MM-DD') ---- */
const pad = n => String(n).padStart(2, '0');
const ymd = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const parseYmd = s => { const p = String(s).split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); };
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
function startOfWeek(d, weekStart) {
  const diff = (d.getDay() - weekStart + 7) % 7;
  return addDays(new Date(d.getFullYear(), d.getMonth(), d.getDate()), -diff);
}
function daysBetween(a, b) { // whole local days from a to b
  const A = Date.UTC(a.getFullYear(), a.getMonth(), a.getDate());
  const B = Date.UTC(b.getFullYear(), b.getMonth(), b.getDate());
  return Math.round((B - A) / 86400000);
}
function dateLabel(s) { const d = parseYmd(s); return d.getDate() + ' ' + MONTHS[d.getMonth()]; }
function dateLabelLong(s) { const d = parseYmd(s); return WEEKDAYS[d.getDay()] + ' ' + d.getDate() + ' ' + MONTHS[d.getMonth()]; }
function relDay(s, todayStr) {
  const n = daysBetween(parseYmd(s), parseYmd(todayStr));
  if (n === 0) return 'اليوم';
  if (n === 1) return 'أمس';
  if (n === 2) return 'قبل يومين';
  if (n > 2 && n <= 10) return 'قبل ' + n + ' أيام';
  return dateLabel(s);
}

/* ---- numbers ---- */
function toNum(v) {
  if (v === null || v === undefined) return null;
  let s = String(v).trim();
  if (!s) return null;
  s = s.replace(/[٠-٩]/g, c => '٠١٢٣٤٥٦٧٨٩'.indexOf(c))
       .replace(/[۰-۹]/g, c => '۰۱۲۳۴۵۶۷۸۹'.indexOf(c))
       .replace(/[٫,،]/g, '.')
       .replace(/[^\d.]/g, '');
  if (!s) return null;
  const n = parseFloat(s);
  return Number.isFinite(n) ? n : null;
}
function fmt(n) { // up to 1 decimal, no trailing zero, thousands separators
  if (n === null || n === undefined || !Number.isFinite(n)) return '–';
  const r = Math.round(n * 10) / 10;
  return r.toLocaleString('en-US', { maximumFractionDigits: 1 });
}
function fmtDur(ms) {
  if (!ms || ms < 0) return '0:00';
  const t = Math.floor(ms / 1000), h = Math.floor(t / 3600), m = Math.floor((t % 3600) / 60), s = t % 60;
  return h ? h + ':' + pad(m) + ':' + pad(s) : m + ':' + pad(s);
}
function fmtMin(ms) {
  const m = Math.round((ms || 0) / 60000);
  if (m < 60) return m + ' د';
  return Math.floor(m / 60) + ' س ' + (m % 60) + ' د';
}
function fmtClock(sec) { sec = Math.max(0, Math.ceil(sec)); return Math.floor(sec / 60) + ':' + pad(sec % 60); }

/* ---- names ---- */
function normName(s) {
  return String(s || '').toLowerCase()
    .replace(/[ً-ٰٟـ]/g, '')
    .replace(/[أإآ]/g, 'ا').replace(/ى/g, 'ي').replace(/ة/g, 'ه')
    .replace(/\s+/g, ' ').trim();
}

/* ---- sets and sessions ---- */
const isDone = s => !!(s && s.done && s.r > 0);
const e1rm = (w, r) => (r <= 1 ? w : w * (1 + r / 30)); // Epley
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

function sessionStats(s) {
  let volume = 0, sets = 0, reps = 0, fails = 0, exCount = 0;
  for (const ex of s.exercises || []) {
    let any = false;
    for (const st of ex.sets || []) {
      if (!isDone(st)) continue;
      any = true; sets++; reps += st.r; volume += (st.w || 0) * st.r;
      if (st.f) fails++;
    }
    if (any) exCount++;
  }
  const end = s.finishedAt || s.updatedAt || s.startedAt;
  return { volume, sets, reps, fails, exCount, durationMs: s.startedAt ? Math.max(0, end - s.startedAt) : 0 };
}
function aggregate(list) {
  const a = { sessions: list.length, volume: 0, sets: 0, reps: 0, fails: 0, durationMs: 0 };
  for (const s of list) {
    const x = sessionStats(s);
    a.volume += x.volume; a.sets += x.sets; a.reps += x.reps; a.fails += x.fails; a.durationMs += x.durationMs;
  }
  return a;
}
const sortAsc = list => list.slice().sort((a, b) => (a.startedAt || 0) - (b.startedAt || 0) || (a.id < b.id ? -1 : 1));
const sortDesc = list => sortAsc(list).reverse();
const inRange = (list, a, b) => list.filter(s => s.date >= a && s.date <= b);

/* best set of an exercise inside one session (merges duplicate entries of the same exercise) */
function exerciseOfSession(s, key) {
  const sets = [];
  for (const ex of s.exercises || []) if (normName(ex.name) === key) for (const st of ex.sets || []) if (isDone(st)) sets.push(st);
  if (!sets.length) return null;
  let maxW = 0, e1 = 0, maxR = 0, volume = 0;
  for (const st of sets) {
    const w = st.w || 0;
    if (w > maxW) maxW = w;
    const e = e1rm(w, st.r); if (e > e1) e1 = e;
    if (st.r > maxR) maxR = st.r;
    volume += w * st.r;
  }
  return { sets, maxW, e1, maxR, volume };
}

/* personal records: a session set beats every earlier session; the first time is a baseline, not a record */
function computePRs(sessions) {
  const best = new Map(), bySession = {}, list = [];
  for (const s of sortAsc(sessions)) {
    const keys = [];
    for (const ex of s.exercises || []) { const k = normName(ex.name); if (k && !keys.includes(k)) keys.push(k); }
    for (const k of keys) {
      const cur = exerciseOfSession(s, k);
      if (!cur) continue;
      const nameOf = (s.exercises.find(e => normName(e.name) === k) || {}).name;
      const b = best.get(k);
      if (b) {
        let kind = null, value = 0;
        if (cur.maxW > 0 && cur.maxW > b.maxW) { kind = 'w'; value = cur.maxW; }
        else if (cur.e1 > 0 && cur.e1 > b.e1 + 0.01 && cur.maxW > 0) { kind = 'e1'; value = cur.e1; }
        else if (cur.maxW === 0 && b.maxW === 0 && cur.maxR > b.maxR) { kind = 'r'; value = cur.maxR; }
        if (kind) {
          const pr = { sid: s.id, date: s.date, ex: nameOf, kind, value };
          (bySession[s.id] = bySession[s.id] || []).push(pr); list.push(pr);
        }
      }
      const nb = b || { maxW: 0, e1: 0, maxR: 0 };
      nb.maxW = Math.max(nb.maxW, cur.maxW); nb.e1 = Math.max(nb.e1, cur.e1); nb.maxR = Math.max(nb.maxR, cur.maxR);
      best.set(k, nb);
    }
  }
  return { bySession, list };
}

function exerciseSeries(sessions, key) {
  const out = [];
  for (const s of sortAsc(sessions)) {
    const cur = exerciseOfSession(s, key);
    if (cur) out.push({ sid: s.id, date: s.date, startedAt: s.startedAt, ...cur });
  }
  return out;
}
function exerciseList(sessions) {
  const m = new Map();
  for (const s of sortAsc(sessions)) {
    for (const ex of s.exercises || []) {
      if (!(ex.sets || []).some(isDone)) continue;
      const k = normName(ex.name); if (!k) continue;
      const e = m.get(k) || { key: k, name: ex.name, count: 0, last: '' , sids: new Set() };
      e.name = ex.name; e.last = s.date; e.sids.add(s.id); e.count = e.sids.size;
      m.set(k, e);
    }
  }
  return [...m.values()].map(e => ({ key: e.key, name: e.name, count: e.count, last: e.last }))
    .sort((a, b) => b.count - a.count || (a.last < b.last ? 1 : -1));
}
/* exercises of the latest earlier session of the same type, used as a starting template */
function templateFromLast(sessions, type) {
  const prev = sortDesc(sessions).find(s => s.type === type && (s.exercises || []).length);
  if (!prev) return [];
  return prev.exercises.filter(e => e.name).map(e => ({ name: e.name, lib: e.lib || null, n: Math.max(1, (e.sets || []).length) }));
}
/* what the same exercise looked like last time (for hints and placeholders) */
function lastSetsFor(sessions, name, beforeId) {
  const k = normName(name);
  for (const s of sortDesc(sessions)) {
    if (s.id === beforeId) continue;
    const sets = [];
    for (const ex of s.exercises || []) if (normName(ex.name) === k) for (const st of ex.sets || []) if (isDone(st)) sets.push(st);
    if (sets.length) return { date: s.date, sets };
  }
  return null;
}

/* ---- calendar helpers ---- */
function weekDays(anchor, weekStart) {
  const a = startOfWeek(anchor, weekStart);
  return Array.from({ length: 7 }, (_, i) => addDays(a, i));
}
function monthMatrix(year, month, weekStart) { // array of weeks; each day {date, inMonth}
  const first = new Date(year, month, 1);
  let cur = startOfWeek(first, weekStart);
  const weeks = [];
  for (let w = 0; w < 6; w++) {
    const row = [];
    for (let i = 0; i < 7; i++) { row.push({ date: ymd(cur), day: cur.getDate(), inMonth: cur.getMonth() === month }); cur = addDays(cur, 1); }
    if (w >= 4 && !row.some(c => c.inMonth)) break;
    weeks.push(row);
  }
  return weeks;
}
function monthTotals(sessions, year) {
  return Array.from({ length: 12 }, (_, m) => {
    const a = year + '-' + pad(m + 1) + '-01', b = year + '-' + pad(m + 1) + '-31';
    return { month: m, ...aggregate(inRange(sessions, a, b)) };
  });
}

if (typeof module !== 'undefined') {
  module.exports = { MONTHS, WEEKDAYS, WD_SHORT, WD_MIN, TYPES, TYPE_ORDER, pad, ymd, parseYmd, addDays, startOfWeek, daysBetween, dateLabel, dateLabelLong, relDay,
    toNum, fmt, fmtDur, fmtMin, fmtClock, normName, isDone, e1rm, uid, sessionStats, aggregate, sortAsc, sortDesc, inRange, exerciseOfSession,
    computePRs, exerciseSeries, exerciseList, templateFromLast, lastSetsFor, weekDays, monthMatrix, monthTotals };
}

/* ===== data: local mirror (instant, offline) + private cloud copy (db) ===== */
const LS_KEY = 'sijill-alhadid:v1';
const DEFAULTS = { weekStart: 6, rest: 90 };
const store = {
  sessions: [],
  settings: { ...DEFAULTS },
  sync: 'wait',   // 'wait' | 'cloud' | 'local'
  loaded: false
};
const subs = new Set();
const sleep = ms => new Promise(r => setTimeout(r, ms));
function emit() { subs.forEach(fn => { try { fn(); } catch (e) { console.error(e); } }); }
function setSync(v) { if (store.sync !== v) { store.sync = v; emit(); } }

function lsLoad() {
  try {
    const j = JSON.parse(localStorage.getItem(LS_KEY) || 'null');
    if (j && Array.isArray(j.sessions)) return { sessions: j.sessions, settings: j.settings || null, pending: j.pending || [], deleted: j.deleted || [], cfgPending: !!j.cfgPending, cloudSeen: !!j.cloudSeen };
  } catch (e) {}
  return { sessions: [], settings: null, pending: [], deleted: [], cfgPending: false, cloudSeen: false };
}
let ls = lsLoad();
function lsSave() {
  try { localStorage.setItem(LS_KEY, JSON.stringify({ ...ls, sessions: store.sessions, settings: store.settings })); } catch (e) {}
}
store.sessions = ls.sessions.filter(validSession);
if (ls.settings) store.settings = { ...DEFAULTS, ...ls.settings };

function validSession(s) {
  return s && typeof s.id === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s.date || '') && Array.isArray(s.exercises);
}
const plain = o => JSON.parse(JSON.stringify(o));
function cleanSession(s) { // sanitise anything that comes from outside (import, cloud)
  const num = v => (typeof v === 'number' && Number.isFinite(v) && v >= 0 ? v : null);
  return {
    id: String(s.id), date: s.date, type: TYPES[s.type] ? s.type : 'other',
    startedAt: num(s.startedAt) || Date.parse(s.date) || Date.now(), finishedAt: num(s.finishedAt), updatedAt: num(s.updatedAt) || Date.now(),
    note: typeof s.note === 'string' ? s.note.slice(0, 2000) : '',
    exercises: (s.exercises || []).slice(0, 60).map(e => ({
      id: String(e.id || uid()), name: String(e.name || '').slice(0, 80), lib: e.lib ? String(e.lib) : null,
      sets: (e.sets || []).slice(0, 60).map(t => ({ w: num(t.w), r: num(t.r), f: !!t.f, done: !!t.done }))
    }))
  };
}

/* ---- cloud connection ---- */
let col = null, unsub = null, loadTimer = null, definitive = false;
async function connectCloud() {
  try {
    const c = window.claude;
    if (!c || typeof c.use !== 'function') return setSync('local');
    const [db, user] = await Promise.all([c.use('db'), c.use('user')]);
    if (!db || !user) return setSync('local');
    const id = await user.id();
    if (!id) return setSync('local');
    col = db.collection('data/users/' + id);
    loadTimer = setTimeout(() => { if (!definitive) setSync('local'); }, 10000);
    unsub = col.onSnapshot(onSnap, () => { clearTimeout(loadTimer); setSync('local'); });
    pump();
  } catch (e) { setSync('local'); }
}
function onSnap(snap) {
  const remote = {}; let cfg = null;
  for (const d of snap.docs) {
    const x = d.data(); if (!x) continue;
    if (d.id === 'cfg') cfg = x;
    else if (d.id.indexOf('s_') === 0) { const c = { ...x, id: d.id }; if (validSession(c)) remote[d.id] = cleanSession(c); }
  }
  const fresh = !snap.metadata || !snap.metadata.fromCache;
  if (fresh && !definitive) {
    definitive = true; clearTimeout(loadTimer);
    if (!ls.cloudSeen) { ls.cloudSeen = true; for (const s of store.sessions) if (!ls.pending.includes(s.id) && !remote[s.id]) ls.pending.push(s.id); }
  }
  if (fresh && !cfg && !Object.keys(remote).length && store.sessions.length) {
    // the cloud copy looks empty while this device still has workouts: keep them and upload them again
    for (const s of store.sessions) if (!ls.deleted.includes(s.id) && !ls.pending.includes(s.id)) ls.pending.push(s.id);
  }
  const byId = {}; for (const s of store.sessions) byId[s.id] = s;
  const merged = { ...remote };
  for (const id of ls.pending) { const l = byId[id]; if (l && (!remote[id] || (l.updatedAt || 0) >= (remote[id].updatedAt || 0))) merged[id] = l; }
  for (const id of ls.deleted) delete merged[id];
  const next = Object.values(merged);
  let changed = next.length !== store.sessions.length;
  if (!changed) for (const s of next) { if (!byId[s.id] || JSON.stringify(byId[s.id]) !== JSON.stringify(s)) { changed = true; break; } }
  if (changed) store.sessions = next;
  if (cfg && !ls.cfgPending) {
    const c2 = { weekStart: Number.isInteger(cfg.weekStart) ? cfg.weekStart : DEFAULTS.weekStart, rest: Number(cfg.rest) > 0 ? Number(cfg.rest) : DEFAULTS.rest };
    if (c2.weekStart !== store.settings.weekStart || c2.rest !== store.settings.rest) { store.settings = { ...store.settings, ...c2 }; changed = true; }
  }
  store.loaded = true;
  lsSave();
  if (fresh) { setSync('cloud'); setTimeout(retryPending, 0); }
  if (changed) emit();
}

/* ---- write queue: one write at a time, spaced, only for things that changed ---- */
const queue = [], timers = {}; let pumping = false;
function scheduleWrite(id, delay) {
  clearTimeout(timers[id]);
  timers[id] = setTimeout(() => { if (!queue.includes(id)) queue.push(id); pump(); }, delay === undefined ? 700 : delay);
}
async function pump() {
  if (pumping || !col) return;
  pumping = true;
  try {
    while (queue.length && col) {
      const id = queue.shift();
      try { await writeOne(id); }
      catch (e) { if (e && e.code === 'unavailable') { await sleep(1500); try { await writeOne(id); } catch (e2) { setSync('local'); } } else setSync('local'); }
      await sleep(70);
    }
  } finally { pumping = false; }
}
async function writeOne(id) {
  if (id === 'cfg') {
    const stamp = store.settings.updatedAt || 0;
    await col.doc('cfg').set({ weekStart: store.settings.weekStart, rest: store.settings.rest, updatedAt: Date.now() });
    if ((store.settings.updatedAt || 0) === stamp) { ls.cfgPending = false; lsSave(); }
    return;
  }
  const s = store.sessions.find(x => x.id === id);
  if (s) {
    const ver = s.updatedAt;
    await col.doc(id).set(plain(s));
    if (s.updatedAt === ver) { ls.pending = ls.pending.filter(x => x !== id); lsSave(); }
  } else {
    await col.doc(id).delete();
    ls.deleted = ls.deleted.filter(x => x !== id); ls.pending = ls.pending.filter(x => x !== id); lsSave();
  }
}
function retryPending() {
  if (!col) return;
  for (const id of ls.pending) scheduleWrite(id, 0);
  for (const id of ls.deleted) scheduleWrite(id, 0);
  if (ls.cfgPending) scheduleWrite('cfg', 0);
}
function flushNow() { for (const id of ls.pending) scheduleWrite(id, 0); for (const id of ls.deleted) scheduleWrite(id, 0); if (ls.cfgPending) scheduleWrite('cfg', 0); }
window.addEventListener('online', retryPending);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flushNow(); else retryPending(); });

/* ---- API used by the UI ---- */
function pendingCount() { return ls.pending.length + ls.deleted.length + (ls.cfgPending ? 1 : 0); }
function getSession(id) { return store.sessions.find(s => s.id === id) || null; }
function touch(s) {
  s.updatedAt = Date.now();
  if (!ls.pending.includes(s.id)) ls.pending.push(s.id);
  ls.deleted = ls.deleted.filter(x => x !== s.id);
  lsSave(); scheduleWrite(s.id);
}
function createSession(type, tpl, lib) {
  const now = Date.now();
  const s = { id: 's_' + uid(), date: ymd(new Date(now)), type, startedAt: now, finishedAt: null, updatedAt: now, note: '', exercises: [] };
  for (const t of tpl || []) s.exercises.push({ id: uid(), name: t.name, lib: t.lib || null, sets: Array.from({ length: t.n || 3 }, () => ({ w: null, r: null, f: false, done: false })) });
  store.sessions.push(s);
  touch(s); emit();
  return s;
}
function deleteSession(id) {
  store.sessions = store.sessions.filter(s => s.id !== id);
  ls.pending = ls.pending.filter(x => x !== id);
  if (!ls.deleted.includes(id)) ls.deleted.push(id);
  lsSave(); scheduleWrite(id, 200); emit();
}
function setSetting(k, v) {
  store.settings = { ...store.settings, [k]: v, updatedAt: Date.now() };
  ls.cfgPending = true; lsSave(); scheduleWrite('cfg'); emit();
}
function exportJson() {
  return JSON.stringify({ app: 'sijill-alhadid', version: 1, exportedAt: new Date().toISOString(), settings: { weekStart: store.settings.weekStart, rest: store.settings.rest }, sessions: store.sessions }, null, 1);
}
function importJson(text) { // returns {added, updated, skipped}
  let j; try { j = JSON.parse(text); } catch (e) { throw new Error('الملف غير صالح'); }
  const list = Array.isArray(j) ? j : (j && Array.isArray(j.sessions) ? j.sessions : null);
  if (!list) throw new Error('لا توجد تمارين في هذا الملف');
  let added = 0, updated = 0, skipped = 0;
  for (const raw of list) {
    if (!validSession(raw)) { skipped++; continue; }
    const s = cleanSession(raw);
    if (s.id.indexOf('s_') !== 0) s.id = 's_' + s.id.replace(/[^A-Za-z0-9_\-.~:@+]/g, '').slice(0, 60);
    const i = store.sessions.findIndex(x => x.id === s.id);
    if (i < 0) { store.sessions.push(s); added++; }
    else if ((s.updatedAt || 0) > (store.sessions[i].updatedAt || 0)) { store.sessions[i] = s; updated++; }
    else { skipped++; continue; }
    if (!ls.pending.includes(s.id)) ls.pending.push(s.id);
    scheduleWrite(s.id, 300 + (added + updated) * 90);
  }
  lsSave(); emit();
  return { added, updated, skipped };
}
function wipeAll() {
  const ids = store.sessions.map(s => s.id);
  store.sessions = []; ls.pending = [];
  for (const id of ids) if (!ls.deleted.includes(id)) ls.deleted.push(id);
  lsSave(); for (const id of ids) scheduleWrite(id, 100); emit();
}
function syncLabel() {
  if (store.sync === 'cloud') return pendingCount() ? { cls: 'wait', text: 'جارٍ الحفظ…' } : { cls: '', text: 'محفوظ في حسابك' };
  if (store.sync === 'local') return { cls: 'local', text: 'محفوظ على هذا الجهاز فقط' };
  return { cls: 'wait', text: 'جارٍ الاتصال…' };
}

/* ---- charts (inline SVG; x runs right to left, like the rest of the page) ---- */
function niceStep(raw) {
  const exp = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / exp;
  return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * exp;
}
function barChart(items, o) {
  // items: [{label, parts:[{type, v}], today, hl}] ; o: {w, h, fmtV}
  const W = o.w || 340, H = o.h || 170, mt = 20, mb = 26, mx = 8;
  const slot = (W - mx * 2) / items.length, bw = Math.min(30, slot * 0.58);
  const totals = items.map(it => it.parts.reduce((a, p) => a + p.v, 0));
  const maxV = Math.max(1, ...totals), ph = H - mt - mb;
  let g = '<line class="grid" x1="' + mx + '" x2="' + (W - mx) + '" y1="' + (H - mb) + '" y2="' + (H - mb) + '"/>';
  items.forEach((it, i) => {
    const cx = W - mx - (i + 0.5) * slot, x = cx - bw / 2;
    let y = H - mb;
    if (!totals[i]) g += '<rect class="stub" x="' + x + '" y="' + (H - mb - 4) + '" width="' + bw + '" height="4" rx="2"/>';
    it.parts.forEach(p => {
      const h = Math.max(4, ph * (p.v / maxV));
      y -= h;
      g += '<rect class="bar t-' + p.type + '" x="' + x + '" y="' + y + '" width="' + bw + '" height="' + h + '" rx="5"/>';
    });
    if (totals[i]) g += '<text class="val" x="' + cx + '" y="' + (y - 5) + '" text-anchor="middle">' + (o.fmtV ? o.fmtV(totals[i]) : short(totals[i])) + '</text>';
    g += '<text class="tick' + (it.today ? ' today' : '') + '" x="' + cx + '" y="' + (H - 8) + '" text-anchor="middle">' + esc(it.label) + '</text>';
  });
  return '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(o.aria || 'مخطط') + '">' + g + '</svg>';
}
function lineChart(pts, o) {
  // pts: [{y, pr, label}] oldest first; drawn right (oldest) to left (newest)
  const W = 340, H = 200, ml = 12, mr = 40, mt = 22, mb = 28;
  const ys = pts.map(p => p.y);
  let lo = Math.min(...ys), hi = Math.max(...ys);
  if (hi === lo) { hi += 1; lo = Math.max(0, lo - 1); }
  const step = niceStep((hi - lo) / 3);
  lo = Math.floor(lo / step) * step; hi = Math.ceil(hi / step) * step;
  const pad = 14, pw = W - ml - mr, ph = H - mt - mb;
  const X = i => (pts.length === 1 ? W - mr - pw / 2 : W - mr - pad - (i / (pts.length - 1)) * (pw - pad * 2));
  const Y = v => mt + ph * (1 - (v - lo) / (hi - lo));
  let g = '';
  for (let v = lo; v <= hi + step / 2; v += step) {
    g += '<line class="grid" x1="' + ml + '" x2="' + (W - mr) + '" y1="' + Y(v) + '" y2="' + Y(v) + '"/>';
    g += '<text class="tick" x="' + (W - mr + 6) + '" y="' + (Y(v) + 4) + '" text-anchor="start">' + fmt(v) + '</text>';
  }
  const path = pts.map((p, i) => (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(p.y).toFixed(1)).join(' ');
  if (pts.length > 1) {
    g += '<path class="area" d="' + path + ' L' + X(pts.length - 1).toFixed(1) + ' ' + (H - mb) + ' L' + X(0).toFixed(1) + ' ' + (H - mb) + ' Z"/>';
    g += '<path class="ln" d="' + path + '"/>';
  }
  pts.forEach((p, i) => { g += '<circle class="dot' + (p.pr ? ' pr' : '') + '" cx="' + X(i).toFixed(1) + '" cy="' + Y(p.y).toFixed(1) + '" r="' + (pts.length > 24 ? 3 : 4.5) + '"/>'; });
  const mi = ys.indexOf(Math.max(...ys)), last = pts.length - 1;
  (ys[mi] === ys[last] ? [last] : [last, mi]).forEach(i => {
    g += '<text class="val" x="' + X(i).toFixed(1) + '" y="' + (Y(pts[i].y) - 10).toFixed(1) + '" text-anchor="middle">' + fmt(pts[i].y) + '</text>';
  });
  const marks = pts.length === 1 ? [0] : [...new Set([0, Math.floor(last / 2), last])];
  marks.forEach(i => { g += '<text class="tick" x="' + X(i).toFixed(1) + '" y="' + (H - 8) + '" text-anchor="middle">' + esc(pts[i].label) + '</text>'; });
  return '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(o.aria || 'مخطط التقدم') + '">' + g + '</svg>';
}

/* ===== views B: history (week / month / year), progress, more ===== */
function periodOf(view, anchor, wk) {
  if (view === 'week') {
    const a = startOfWeek(anchor, wk), b = addDays(a, 6);
    const title = a.getMonth() === b.getMonth() ? a.getDate() + ' – ' + b.getDate() + ' ' + MONTHS[b.getMonth()] : a.getDate() + ' ' + MONTHS[a.getMonth()] + ' – ' + b.getDate() + ' ' + MONTHS[b.getMonth()];
    return { a: ymd(a), b: ymd(b), pa: ymd(addDays(a, -7)), pb: ymd(addDays(a, -1)), title, what: 'الأسبوع الماضي' };
  }
  if (view === 'month') {
    const y = anchor.getFullYear(), m = anchor.getMonth();
    return { a: ymd(new Date(y, m, 1)), b: ymd(new Date(y, m + 1, 0)), pa: ymd(new Date(y, m - 1, 1)), pb: ymd(new Date(y, m, 0)), title: MONTHS[m] + ' ' + y, what: 'الشهر الماضي', y, m };
  }
  const y = anchor.getFullYear();
  return { a: y + '-01-01', b: y + '-12-31', pa: (y - 1) + '-01-01', pb: (y - 1) + '-12-31', title: String(y), what: 'السنة الماضية', y };
}
function shiftAnchor(view, anchor, dir) {
  if (view === 'week') return addDays(anchor, 7 * dir);
  if (view === 'month') return new Date(anchor.getFullYear(), anchor.getMonth() + dir, 1);
  return new Date(anchor.getFullYear() + dir, 0, 1);
}

function historyView(c) {

  if (P.b >= c.today) { // the current period is not over yet: compare with the same stretch of the previous one
    const cut = ymd(addDays(parseYmd(P.pa), daysBetween(parseYmd(P.a), parseYmd(c.today))));
    if (cut < pb) { pb = cut; what = 'نفس الفترة السابقة'; }
  }
  const prev = aggregate(inRange(c.sessions, P.pa, pb));
  const canNext = P.b < c.today;

/* ===== app: state, rendering, events ===== */
const $ = s => document.querySelector(s);
const state = { tab: 'today', sid: null, hv: 'week', ha: new Date(), exKey: null, metric: 'w', sheet: null, rest: null, prSeen: new Set() };
const DEFAULT_TPL = { pull: ['latpd', 'cabrow', 'bbcurl'], push: ['bench', 'ohp', 'pushdown'], legs: ['squat', 'legpress', 'legcurl'], upper: ['incdb', 'dbrow', 'latraise'], other: [] };
const TABS = [['today', 'اليوم', 'today'], ['history', 'السجل', 'history'], ['progress', 'التقدم', 'progress'], ['more', 'المزيد', 'more']];
const hasData = s => sessionStats(s).sets > 0;
const isBlank = s => !(s.note || '').trim() && s.exercises.every(e => e.sets.every(x => !x.done && x.w == null && x.r == null));

function ctx() {
  const all = store.sessions, sessions = all.filter(hasData), today = ymd(new Date());
  const open = state.sid ? null : all.filter(s => !s.finishedAt && daysBetween(parseYmd(s.date), parseYmd(today)) <= 1).sort((a, b) => b.startedAt - a.startedAt)[0] || null;
  return { all, sessions, today, prs: computePRs(sessions), openSess: open, session: state.sid ? getSession(state.sid) : null, hv: state.hv, ha: state.ha, exKey: state.exKey, metric: state.metric };
}
const navHtml = () => '<div class="in">' + TABS.map(t => '<button data-act="tab" data-tab="' + t[0] + '"' + (state.tab === t[0] ? ' aria-current="page"' : '') + '>' + icon(t[2]) + '<span>' + t[1] + '</span></button>').join('') + '</div>';
let dirty = false;
function render() {
  dirty = false;
  const c = ctx();
  if (state.sid && !c.session) state.sid = null;
  const y = window.scrollY;
  $('#app').innerHTML = state.tab === 'today' ? (c.session ? workoutView(c) : homeView(c)) : state.tab === 'history' ? historyView(c) : state.tab === 'progress' ? progressView(c) : moreView(c);
  $('#nav').innerHTML = navHtml();
  window.scrollTo(0, y);
  renderRest(); tickClock();
}
function softRender() {
  const a = document.activeElement;
  if (a && a.matches && a.matches('#app input, #app textarea, #app select')) { dirty = true; return; }
  render();
}
document.addEventListener('focusout', () => { if (dirty) setTimeout(() => { const a = document.activeElement; if (!(a && a.matches && a.matches('#app input, #app textarea, #app select'))) render(); }, 60); });

/* ---- toast, sound, rest timer ---- */
let toastT = null, actx = null;
function toast(msg) { const el = $('#toast'); el.innerHTML = '<span></span>'; el.firstChild.textContent = msg; clearTimeout(toastT); toastT = setTimeout(() => { el.innerHTML = ''; }, 2800); }
function unlockAudio() { try { const A = window.AudioContext || window.webkitAudioContext; if (A && !actx) actx = new A(); if (actx && actx.state === 'suspended') actx.resume(); } catch (e) {} }
function beep() {
  try {
    if (!actx) return; const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime;
    o.frequency.value = 880; g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.25, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.5);
    o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + 0.55);
  } catch (e) {}
}
function startRest(sec) { state.rest = { end: Date.now() + sec * 1000, over: false, hideAt: 0 }; renderRest(); }
function renderRest() {
  const el = $('#rest'), r = state.rest;
  if (!r) { el.innerHTML = ''; return; }
  const left = (r.end - Date.now()) / 1000;
  el.className = 'rest' + (left <= 0 ? ' over' : '');
  el.innerHTML = '<div class="in"><div><div class="l">' + (left <= 0 ? 'جاهز للمجموعة التالية' : 'راحة') + '</div><div class="tm num" data-rest-tm>' + fmtClock(left) + '</div></div>'
    + '<button data-act="rest-add" data-s="-15" aria-label="انقص 15 ثانية">−15</button><button data-act="rest-add" data-s="15" aria-label="زد 15 ثانية">+15</button><button data-act="rest-skip" aria-label="تخطي الراحة">' + icon('skip') + '</button></div>';
}
function tickClock() { const s = state.sid && getSession(state.sid), el = document.querySelector('[data-clock]'); if (el && s) el.textContent = fmtDur((s.finishedAt || Date.now()) - s.startedAt); }
function onTick() {
  const r = state.rest;
  if (r) {
    const left = (r.end - Date.now()) / 1000;
    if (left <= 0 && !r.over) { r.over = true; r.hideAt = Date.now() + 12000; beep(); try { if (navigator.vibrate) navigator.vibrate([200, 100, 200]); } catch (e) {} renderRest(); }
    else if (r.over && Date.now() > r.hideAt) { state.rest = null; renderRest(); }
    else if (!r.over) { const t = document.querySelector('[data-rest-tm]'); if (t) t.textContent = fmtClock(left); }
  }
  tickClock();
}

/* ---- sheets ---- */
function paintSheet() {
  const sh = state.sheet, root = $('#sheet');
  if (!sh) { root.innerHTML = ''; document.body.style.overflow = ''; return; }
  const c = ctx(); let html = '';
  if (sh.kind === 'add-ex') { c.type = (getSession(state.sid) || {}).type; html = addExSheet(c); }
  else if (sh.kind === 'detail' || sh.kind === 'summary') { const s = getSession(sh.id); html = s ? (sh.kind === 'detail' ? detailSheet(c, s) : summarySheet(c, s)) : ''; }
  else if (sh.kind === 'confirm') html = confirmSheet(sh);
  else if (sh.kind === 'export') html = exportSheet(sh.json);
  root.innerHTML = html; document.body.style.overflow = html ? 'hidden' : '';
}
function openSheet(kind, data) { state.sheet = Object.assign({ kind }, data || {}); paintSheet(); }
function closeSheet() { state.sheet = null; paintSheet(); }

/* ---- workout actions ---- */
function curSession() { return state.sid ? getSession(state.sid) : null; }
function exOf(s, el) { const x = el && el.closest('[data-ex]'); return x ? s.exercises.find(e => e.id === x.dataset.ex) : null; }
function updateScoreboard() {
  const s = curSession(); if (!s) return; const st = sessionStats(s);
  const put = (k, v) => { const el = document.querySelector('[data-sb="' + k + '"]'); if (el) el.textContent = v; };
  put('volume', fmt(st.volume)); put('sets', st.sets); put('fails', st.fails);
}
function startWorkout(type) {
  const past = store.sessions.filter(hasData), tpl = templateFromLast(past, type);
  const use = tpl.length ? tpl : (DEFAULT_TPL[type] || []).map(id => ({ name: LIBMAP[id].ar, lib: id, n: 3 }));
  const s = createSession(type, use); state.sid = s.id; state.tab = 'today'; render(); window.scrollTo(0, 0);
}
function addExercise(name, lib) {
  const s = curSession(); if (!s || !name) return;
  const last = lastSetsFor(store.sessions, name, s.id), n = last ? Math.min(8, last.sets.length) : 3;
  s.exercises.push({ id: uid(), name: name.slice(0, 80), lib: lib || null, sets: Array.from({ length: n }, () => ({ w: null, r: null, f: false, done: false })) });
  touch(s); closeSheet(); render();
  const cards = document.querySelectorAll('.ex'); if (cards.length) cards[cards.length - 1].scrollIntoView({ block: 'center' });
}
function checkPR(s, e) {
  const k = normName(e.name), list = computePRs(store.sessions.filter(hasData)).bySession[s.id] || [];
  for (const p of list) {
    if (normName(p.ex) !== k) continue;
    const key = s.id + '|' + k + '|' + p.kind + '|' + p.value;
    if (!state.prSeen.has(key)) { state.prSeen.add(key); toast('رقم قياسي جديد · ' + e.name + ' ' + fmt(p.value) + (p.kind === 'r' ? ' تكرار' : ' كغ')); return; }
  }
}
function toggleDone(row) {
  const s = curSession(), e = s && exOf(s, row); if (!e) return;
  const st = e.sets[+row.dataset.i]; if (!st) return;
  if (st.done) { st.done = false; touch(s); render(); return; }
  const wIn = row.querySelector('[data-f="w"]'), rIn = row.querySelector('[data-f="r"]');
  let w = toNum(wIn.value), r = toNum(rIn.value);
  if (w == null) w = toNum(wIn.placeholder);
  if (r == null) r = toNum(rIn.placeholder);
  if (!(r > 0)) { rIn.focus(); toast('اكتب عدد التكرارات'); return; }
  if (w == null) { wIn.focus(); toast('اكتب الوزن، واكتب 0 للتمارين بوزن الجسم'); return; }
  st.w = w; st.r = Math.round(r); st.done = true; touch(s);
  startRest(store.settings.rest); checkPR(s, e); render();
}
function finishSession() {
  const s = curSession(); if (!s) return;
  s.exercises.forEach(e => { e.sets.forEach(x => { if (!x.done && x.r > 0) { x.done = true; if (x.w == null) x.w = 0; } }); e.sets = e.sets.filter(x => x.done); });
  s.exercises = s.exercises.filter(e => e.sets.length);
  if (!sessionStats(s).sets) { touch(s); openSheet('confirm', { title: 'ما سجلت أي مجموعة', text: 'نحذف هذا التمرين الفارغ؟', yes: 'احذفه', act: 'del-yes', id: s.id }); render(); return; }
  const wasOpen = !s.finishedAt; if (wasOpen) s.finishedAt = Date.now();
  touch(s); state.rest = null;
  if (wasOpen) { render(); openSheet('summary', { id: s.id }); } else { state.sid = null; render(); toast('انحفظت التعديلات'); }
}
function leaveWorkout() {
  const s = curSession();
  if (s && isBlank(s) && !s.finishedAt) { deleteSession(s.id); }
  state.sid = null; state.rest = null; render(); window.scrollTo(0, 0);
}
function removeSessionNow(id) {
  deleteSession(id); if (state.sid === id) state.sid = null; closeSheet(); render(); toast('انحذف التمرين');
}

/* ---- backup ---- */
async function doExport() {
  const json = exportJson(), name = 'sijill-alhadid-' + ymd(new Date()) + '.json';
  try {
    const d = window.claude && window.claude.use ? await window.claude.use('downloads') : null;
    if (d) { await d.save({ filename: name, data: json }); toast('انحفظ الملف'); return; }
  } catch (e) { if (e && e.code === 'declined') return; }
  openSheet('export', { json });
}
function importFile(f) {
  if (!f) return;
  if (f.size > 8 * 1024 * 1024) { toast('الملف كبير كثير'); return; }
  const rd = new FileReader();
  rd.onload = () => { try { const r = importJson(String(rd.result)); render(); toast('تم الاستيراد: ' + r.added + ' جديد، ' + r.updated + ' محدّث' + (r.skipped ? '، تخطّينا ' + r.skipped : '')); } catch (err) { toast(err.message || 'تعذّر قراءة الملف'); } };
  rd.onerror = () => toast('تعذّر قراءة الملف');
  rd.readAsText(f);
}

/* ---- events ---- */
document.addEventListener('pointerdown', unlockAudio, { passive: true });
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  const a = t.dataset.act, s = curSession();
  if (a === 'scrim') { if (e.target === t) closeSheet(); return; }
  switch (a) {
    case 'tab': {
      const tab = t.dataset.tab; if (tab === 'history' && state.tab !== 'history') state.ha = new Date();
      state.tab = tab; closeSheet(); render(); window.scrollTo(0, 0); break;
    }
    case 'start': startWorkout(t.dataset.type); break;
    case 'resume': state.sid = t.dataset.id; render(); window.scrollTo(0, 0); break;
    case 'leave': leaveWorkout(); break;
    case 'finish': finishSession(); break;
    case 'add-ex': openSheet('add-ex'); break;
    case 'pick-ex': addExercise(t.dataset.name, t.dataset.lib); break;
    case 'add-set': { const ex = s && exOf(s, t); if (ex && ex.sets.length < 30) { ex.sets.push({ w: null, r: null, f: false, done: false }); touch(s); render(); } break; }
    case 'rm-set': { const ex = s && exOf(s, t); if (ex && ex.sets.length > 1) { ex.sets.pop(); touch(s); render(); updateScoreboard(); } break; }
    case 'rm-ex': {
      const ex = s && exOf(s, t); if (!ex) break;
      if (ex.sets.some(x => x.done || x.w != null || x.r != null)) openSheet('confirm', { title: 'نحذف «' + ex.name + '»؟', text: 'بتنحذف كل مجموعاته من هذا التمرين.', yes: 'احذف', act: 'rm-ex-yes', id: ex.id });
      else { s.exercises = s.exercises.filter(x => x.id !== ex.id); touch(s); render(); }
      break;
    }
    case 'rm-ex-yes': if (s) { s.exercises = s.exercises.filter(x => x.id !== t.dataset.id); touch(s); closeSheet(); render(); updateScoreboard(); } break;
    case 'fail': { const row = t.closest('.setrow'), ex = s && exOf(s, t); if (ex && row) { const st = ex.sets[+row.dataset.i]; st.f = !st.f; touch(s); render(); updateScoreboard(); } break; }
    case 'done': { const row = t.closest('.setrow'); if (row) toggleDone(row); break; }
    case 'rest-add': if (state.rest) { state.rest.end += (+t.dataset.s) * 1000; state.rest.over = false; renderRest(); } break;
    case 'rest-skip': state.rest = null; renderRest(); break;
    case 'rest-set': setSetting('rest', +t.dataset.s); render(); break;
    case 'hv': state.hv = t.dataset.v; render(); break;
    case 'hshift': state.ha = shiftAnchor(state.hv, state.ha, +t.dataset.d); render(); break;
    case 'goto-month': state.hv = 'month'; state.ha = new Date(state.ha.getFullYear(), +t.dataset.m, 1); render(); window.scrollTo(0, 0); break;
    case 'metric': state.metric = t.dataset.m; render(); break;
    case 'open-session': openSheet('detail', { id: t.dataset.id }); break;
    case 'edit-session': state.sid = t.dataset.id; state.tab = 'today'; closeSheet(); render(); window.scrollTo(0, 0); break;
    case 'del-ask': openSheet('confirm', { title: 'نحذف هذا التمرين؟', text: 'بيختفي من السجل والإحصاءات، وما في رجعة.', yes: 'احذف', act: 'del-yes', id: t.dataset.id }); break;
    case 'del-session': if (s) openSheet('confirm', { title: 'نحذف هذا التمرين؟', text: 'بيختفي من السجل والإحصاءات، وما في رجعة.', yes: 'احذف', act: 'del-yes', id: s.id }); break;
    case 'del-yes': removeSessionNow(t.dataset.id); break;
    case 'close-summary': closeSheet(); state.sid = null; state.tab = 'today'; render(); window.scrollTo(0, 0); break;
    case 'close-sheet': closeSheet(); break;
    case 'export': doExport(); break;
    case 'import': { const i = $('#imp'); if (i) i.click(); break; }
    case 'copy-exp': {
      const ta = $('#exp'); if (!ta) break; ta.select();
      try { navigator.clipboard.writeText(ta.value).then(() => toast('تم النسخ'), () => toast('حدد النص وانسخه يدويًا')); } catch (err) { toast('حدد النص وانسخه يدويًا'); }
      break;
    }
    case 'wipe': openSheet('confirm', { title: 'نمسح كل التمارين؟', text: 'بتنحذف كل بياناتك من حسابك ومن هذا الجهاز، وما في رجعة.', yes: 'امسح كل شيء', act: 'wipe-yes' }); break;
    case 'wipe-yes': wipeAll(); state.sid = null; closeSheet(); render(); toast('انمسحت كل التمارين'); break;
  }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'lib-q') { const c = ctx(); c.type = (curSession() || {}).type; $('#lib-list').innerHTML = libListHtml(c, t.value); return; }
  const f = t.dataset && t.dataset.f, s = curSession(); if (!f || !s) return;
  if (f === 'note') { s.note = t.value.slice(0, 2000); touch(s); return; }
  const row = t.closest('.setrow'), ex = exOf(s, t), st = ex && row && ex.sets[+row.dataset.i]; if (!st) return;
  const n = toNum(t.value); st[f] = n == null ? null : (f === 'r' ? Math.round(n) : n);
  touch(s); updateScoreboard();
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'ex-sel') { state.exKey = t.value; render(); }
  else if (t.id === 'wk-sel') { setSetting('weekStart', +t.value); render(); }
  else if (t.id === 'imp') { importFile(t.files && t.files[0]); t.value = ''; }
});
document.addEventListener('focusin', e => { const t = e.target; if (t.matches && t.matches('.setrow .in')) setTimeout(() => { try { t.select(); } catch (err) {} }, 0); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && state.sheet) { closeSheet(); return; }
  if (e.key !== 'Enter') return;
  const t = e.target; if (!t.dataset || !t.dataset.f || t.tagName !== 'INPUT') return;
  const row = t.closest('.setrow'); if (!row) return;
  e.preventDefault();
  if (t.dataset.f === 'w') row.querySelector('[data-f="r"]').focus();
  else { const ok = row.querySelector('[data-act="done"]'); if (ok.getAttribute('aria-pressed') !== 'true') ok.click(); else t.blur(); }
});

/* ---- boot ---- */
(function boot() {
  document.documentElement.lang = 'ar'; document.documentElement.dir = 'rtl';
  subs.add(softRender);
  const open = store.sessions.filter(s => !s.finishedAt && Date.now() - (s.updatedAt || s.startedAt) < 16 * 3600 * 1000).sort((a, b) => b.startedAt - a.startedAt)[0];
  if (open) state.sid = open.id;
  render(); setInterval(onTick, 500); connectCloud();
})();

</script>
